<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111322"/>
      <stop offset="50%" stop-color="#0a0b14"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>

    <!-- Border Gradient (Indigo to Cyan) -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- R Gradient: Crisp White to Lavender -->
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <!-- A Gradient: Electric Sky to Cyan -->
    <linearGradient id="aGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glowing Cyan Dot Gradient -->
    <radialGradient id="dotGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </radialGradient>

    <!-- Glow Filter for Monogram -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#6366f1" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="18"/>
  <!-- Inner Glass Border -->
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Ambient Glow -->
  <circle cx="160" cy="180" r="140" fill="#6366f1" opacity="0.16" filter="blur(35px)"/>
  <circle cx="350" cy="330" r="140" fill="#06b6d4" opacity="0.16" filter="blur(35px)"/>

  <!-- Logo RA Monogram -->
  <g filter="url(#glow)">
    <text x="256" y="312" text-anchor="middle" font-family="'JetBrains Mono', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="240" letter-spacing="-8">
      <tspan fill="url(#rGrad)">R</tspan><tspan fill="url(#dotGrad)" font-size="230" dx="-2">.</tspan><tspan fill="url(#aGrad)" dx="-2">A</tspan>
    </text>
  </g>
</svg>